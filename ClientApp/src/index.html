<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Community Car</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find and rent cars easily with Community Car - Your trusted car rental platform">
  <meta name="keywords" content="car rental, rent a car, car sharing, community car">
  <meta name="author" content="Community Car">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#007bff">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://communitycar.com/">
  <meta property="og:title" content="Community Car - Find and Rent Cars Easily">
  <meta property="og:description" content="Your trusted car rental platform. Find and rent cars easily with Community Car.">
  <meta property="og:image" content="https://communitycar.com/assets/images/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://communitycar.com/">
  <meta property="twitter:title" content="Community Car - Find and Rent Cars Easily">
  <meta property="twitter:description" content="Your trusted car rental platform. Find and rent cars easily with Community Car.">
  <meta property="twitter:image" content="https://communitycar.com/assets/images/twitter-image.jpg">

  <link rel="icon" type="image/jpeg" href="assets/icons/favicon.jpg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon.jpg">
  <link rel="manifest" href="site.webmanifest">

  <!-- Preconnect to external domains for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Tailwind CSS Configuration (Removed CDN) -->

  <!-- Preload critical resources -->
  <link rel="preload" href="assets/styles/theme.scss" as="style">
  <link rel="preload" href="assets/styles/variables.scss" as="style">
</head>
<body>
  <app-root></app-root>

  <!-- Loading spinner for initial load -->
  <div id="initial-loader" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  ">
    <div style="
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    "></div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #initial-loader {
      transition: opacity 0.3s ease-out;
    }

    #initial-loader.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script>
    // Hide loading spinner when Angular app is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hide');
          setTimeout(() => loader.remove(), 300);
        }
      }, 100);
    });
  </script>
</body>
</html>
