<div class="rounded-xl p-4 border shadow-sm transition-all duration-300 flex items-start justify-between relative overflow-hidden" 
     *ngIf="isVisible" 
     [ngClass]="getAlertClass()">
  <div class="flex items-start flex-1">
    <div class="flex-shrink-0 mr-3 mt-0.5 text-lg" *ngIf="showIcon">
      <i [class]="getIconClass()"></i>
    </div>

    <div class="flex-1">
      <div class="text-sm font-bold mb-1" *ngIf="title">
        {{ title }}
      </div>
      <div class="text-sm opacity-90" *ngIf="message">
        {{ message }}
      </div>
    </div>
  </div>

  <button
    class="flex-shrink-0 ml-4 text-current opacity-60 hover:opacity-100 transition-opacity focus:outline-none p-1 rounded-md hover:bg-black/5"
    *ngIf="dismissible"
    (click)="dismiss()"
    aria-label="Close alert"
  >
    <i class="fas fa-times"></i>
  </button>
</div>
