<nav class="relative z-50 bg-[#0a0a0a] transition-all border-b border-white/5">
  <div class="container mx-auto px-6 py-4 flex items-center justify-between">
    
    <!-- Brand/Logo -->
    <a routerLink="/" class="text-xl font-bold tracking-widest text-white/90 hover:text-white transition-colors">
      CARGO
    </a>

    <!-- Unauthenticated Main Navigation -->
    <nav class="hidden md:flex gap-12 text-sm text-white/50 tracking-wider" *ngIf="!currentUser">
      <a routerLink="/" fragment="about" class="hover:text-white transition-colors duration-300">About Us</a>
      <a routerLink="/" fragment="pricing" class="hover:text-white transition-colors duration-300">Pricing</a>
      <a routerLink="/" fragment="reviews" class="hover:text-white transition-colors duration-300">Reviews</a>
      <a routerLink="/" fragment="contact" class="hover:text-white transition-colors duration-300">Contact</a>
    </nav>
    
    <!-- Authenticated Navigation -->
    <nav class="hidden md:flex gap-8 text-sm text-white/50 tracking-wider" *ngIf="currentUser">
      <a routerLink="/dashboard" routerLinkActive="text-white" class="hover:text-white transition-colors duration-300">Dashboard</a>
      <a routerLink="/cars" routerLinkActive="text-white" class="hover:text-white transition-colors duration-300">Cars</a>
      <a routerLink="/bookings" routerLinkActive="text-white" class="hover:text-white transition-colors duration-300">Bookings</a>
    </nav>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-6">
      
      <!-- Notification Bell -->
      <div class="relative" *ngIf="currentUser">
        <button class="flex items-center justify-center w-10 h-10 rounded-full bg-transparent border border-white/10 text-white/50 hover:bg-white/5 hover:text-white transition-colors focus:outline-none" (click)="toggleNotificationMenu()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="absolute top-0 right-0 bg-[#d4af37] text-[#1a1a1a] text-[9px] font-bold px-1.5 py-0.5 rounded-full" *ngIf="unreadNotificationsCount > 0">
            {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
          </span>
        </button>

        <!-- Notification Dropdown -->
        <div class="absolute right-0 mt-3 w-80 max-h-[28rem] bg-[#121212] border border-white/10 rounded-xl shadow-2xl z-50 transition-all origin-top-right duration-200" [ngClass]="isNotificationMenuOpen ? 'opacity-100 visible scale-100 translate-y-0' : 'opacity-0 invisible scale-95 -translate-y-2'">
          <div class="flex items-center justify-between p-4 border-b border-white/10">
            <h3 class="text-sm font-semibold text-white/90">Notifications</h3>
            <button class="text-xs font-medium text-[#e5d4a6] hover:text-white transition-colors" (click)="markAllNotificationsAsRead()" *ngIf="unreadNotificationsCount > 0">
              Mark all read
            </button>
          </div>
          
          <div class="max-h-[20rem] overflow-y-auto custom-scrollbar">
            <div *ngFor="let notification of notifications" class="flex items-start gap-3 p-4 cursor-pointer transition-colors border-b border-white/5 last:border-b-0 hover:bg-white/5" (click)="markNotificationAsRead(notification.id)">
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium text-white/90 mb-1 leading-tight" [ngClass]="{'font-semibold text-white': !notification.read}">{{ notification.title }}</div>
                <div class="text-xs text-white/50 leading-relaxed mb-1">{{ notification.message }}</div>
                <div class="text-[10px] text-white/30">{{ notification.time }}</div>
              </div>
              <div class="flex-shrink-0" *ngIf="!notification.read">
                <div class="w-2 h-2 bg-[#d4af37] rounded-full"></div>
              </div>
            </div>
            
            <div class="p-8 text-center text-white/30 text-sm" *ngIf="notifications.length === 0">
              No new notifications
            </div>
          </div>
        </div>
      </div>

      <!-- User Menu -->
      <div class="relative" *ngIf="currentUser">
        <button class="flex items-center gap-2 p-1.5 rounded-full border border-white/10 hover:bg-white/5 transition-colors focus:outline-none" (click)="isUserMenuOpen = !isUserMenuOpen">
          <img *ngIf="currentUser.avatar" [src]="currentUser.avatar" class="w-8 h-8 rounded-full object-cover" />
          <div *ngIf="!currentUser.avatar" class="w-8 h-8 rounded-full bg-white/10 text-[#e5d4a6] flex items-center justify-center text-xs font-bold">{{ getUserInitials() }}</div>
        </button>

        <!-- User Dropdown Menu -->
        <div class="absolute right-0 mt-3 w-56 bg-[#121212] border border-white/10 rounded-xl shadow-2xl z-50 transition-all origin-top-right duration-200" [ngClass]="isUserMenuOpen ? 'opacity-100 visible scale-100 translate-y-0' : 'opacity-0 invisible scale-95 -translate-y-2'">
          <div class="p-4 border-b border-white/10">
            <div class="text-sm font-semibold text-white/90 truncate">{{ currentUser.name || 'User' }}</div>
            <div class="text-xs text-white/50 truncate">{{ currentUser.email }}</div>
          </div>
          
          <div class="p-2">
            <a routerLink="/profile" class="flex items-center gap-3 w-full p-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-md transition-colors" (click)="isUserMenuOpen = false">
              Profile Settings
            </a>
            <button class="flex items-center gap-3 w-full p-2 text-sm text-red-400 hover:text-red-300 hover:bg-red-900/20 rounded-md transition-colors mt-1 text-left" (click)="logout()">
              Sign Out
            </button>
          </div>
        </div>
      </div>

      <!-- Auth Links -->
      <div class="hidden md:flex gap-6 items-center text-sm" *ngIf="!currentUser">
        <a routerLink="/login" class="text-white/50 hover:text-white transition-colors">Sign In</a>
        <a routerLink="/register" class="px-5 py-2 rounded-lg bg-gradient-to-r from-[#e5d4a6] to-[#f4ecd8] text-[#1a1a1a] font-semibold hover:opacity-90 transition-opacity">Register</a>
      </div>

    </div>
  </div>
</nav>
