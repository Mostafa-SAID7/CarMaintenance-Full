<button
  class="fixed bottom-6 right-6 md:bottom-8 md:right-8 w-12 h-12 rounded-full bg-[#0a0a0a] text-[#e5d4a6] border border-white/10 hover:border-[#e5d4a6] shadow-lg shadow-black/50 z-[1000] flex items-center justify-center transition-all duration-300 hover:shadow-xl hover:-translate-y-1 active:translate-y-0 active:scale-95 group"
  [ngClass]="isVisible ? 'opacity-100 visible translate-y-0 scale-100' : 'opacity-0 invisible translate-y-5 scale-75'"
  (click)="scrollToTop()"
  [attr.aria-label]="'Scroll to top'"
  type="button">
  <svg class="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-1" fill="currentColor" viewBox="0 0 24 24">
    <path d="M7 14l5-5 5 5z"/>
  </svg>
</button>
