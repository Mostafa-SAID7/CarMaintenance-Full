<div class="flex flex-col items-center justify-center transition-all duration-300" 
     [ngClass]="overlay ? 'fixed inset-0 z-[100] bg-white/80 backdrop-blur-sm' : 'p-4'">
  <div class="flex flex-col items-center">
    <div
      class="animate-spin rounded-full border-4 border-primary border-t-transparent shadow-sm"
      [ngClass]="{
        'w-6 h-6 border-2': size === 'small',
        'w-10 h-10 border-3': size === 'medium',
        'w-16 h-16 border-4': size === 'large'
      }"
      [class]="size && !['small','medium','large'].includes(size) ? size : ''"
    ></div>
    <div *ngIf="message" class="mt-4 text-sm font-medium text-gray-700 animate-pulse">{{ message }}</div>
  </div>
</div>
