<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 via-white to-secondary-50 p-4">
  <div class="w-full max-w-md animate-fade-in">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden px-8 py-10 text-center">
      
      <!-- Loading State -->
      <div *ngIf="isLoading" class="animate-fade-in">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-50 rounded-full mb-6">
          <svg class="animate-spin h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Verifying Your Email</h2>
        <p class="text-gray-600">Please wait while we verify your email address...</p>
      </div>

      <!-- Success State -->
      <div *ngIf="!isLoading && isVerified" class="animate-fade-in">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-success-100 rounded-full mb-6">
          <svg class="w-8 h-8 text-success-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Email Verified!</h2>
        <p class="text-gray-600 mb-2">
          Your email has been successfully verified. You can now access your account.
        </p>
        <p class="text-sm text-gray-500 mb-8">
          You will be redirected to the login page in a few seconds...
        </p>
        <button type="button" data-cy="go-to-login" class="btn btn-primary w-full py-3 text-base font-semibold" (click)="goToLogin()">
          Go to Login
        </button>
      </div>

      <!-- Error State -->
      <div *ngIf="!isLoading && !isVerified" class="animate-fade-in">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-error-100 rounded-full mb-6">
          <svg class="w-8 h-8 text-error-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Verification Failed</h2>
        <p class="text-error-600 font-medium mb-8">{{ errorMessage }}</p>

        <div class="flex flex-col space-y-3">
          <button type="button" data-cy="resend-verification" class="btn btn-primary w-full py-3 text-base font-semibold" (click)="resendVerification()">
            Resend Verification Email
          </button>
          <button type="button" class="btn btn-secondary w-full py-3 text-base font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200" (click)="goToLogin()">
            Back to Login
          </button>
        </div>
      </div>
      
    </div>
  </div>
</div>
