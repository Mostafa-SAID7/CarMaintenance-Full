<div class="min-h-screen flex items-center justify-center bg-background p-4 relative overflow-hidden">
  
  <!-- Decorative background elements -->
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-[#d4af37]/10 rounded-full blur-[100px] -z-10 mix-blend-screen"></div>
  <div class="absolute bottom-[-200px] left-[-200px] w-[600px] h-[600px] bg-[#d4af37]/5 rounded-full blur-[120px] -z-10 mix-blend-screen"></div>

  <div class="w-full max-w-md animate-fade-in z-10">
    <div class="glass rounded-3xl overflow-hidden">
      <!-- Header -->
      <div class="px-8 pt-10 pb-6 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-white/5 border border-white/10 rounded-full mb-6 shadow-inner">
          <i class="fa-solid fa-car text-[#e5d4a6] text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-foreground mb-2">Welcome Back</h1>
        <p class="text-foreground/60 text-sm">Sign in to your CARGO account</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="px-8 pb-8">
        <div class="space-y-5">
          <!-- Email Field -->
          <div>
            <label for="email" class="block text-xs font-semibold tracking-wider text-foreground/80 mb-2 uppercase">
              Email Address
            </label>
            <div class="relative">
              <input
                  type="email"
                  id="email"
                  data-cy="email"
                  formControlName="email"
                  placeholder="name@example.com"
                  class="w-full pl-4 pr-10 py-3 bg-black/20 border border-white/10 rounded-xl text-foreground placeholder-foreground/30 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all"
                  [class]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched ? 'border-red-500 focus:border-red-500 focus:ring-red-500' : ''"
                >
              <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                <i class="fa-solid fa-check text-green-400" *ngIf="loginForm.get('email')?.valid && loginForm.get('email')?.touched"></i>
              </div>
            </div>
            <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-2 text-xs text-red-400">
              <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
              <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
            </p>
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block text-xs font-semibold tracking-wider text-foreground/80 mb-2 uppercase">
              Password
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                data-cy="password"
                formControlName="password"
                placeholder="Enter your password"
                class="w-full pl-4 pr-4 py-3 bg-black/20 border border-white/10 rounded-xl text-foreground placeholder-foreground/30 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all"
                [class]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched ? 'border-red-500 focus:border-red-500 focus:ring-red-500' : ''"
              >
            </div>
            <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-2 text-xs text-red-400">
              <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
              <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
            </p>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center">
              <input
                type="checkbox"
                id="rememberMe"
                formControlName="rememberMe"
                class="h-4 w-4 bg-black/20 border-white/20 text-[#d4af37] focus:ring-[#d4af37] rounded"
              >
              <label for="rememberMe" class="ml-2 block text-sm text-foreground/70">
                Remember me
              </label>
            </div>
            <a routerLink="/forgot-password" class="text-sm text-[#e5d4a6] hover:text-white transition-colors">
              Forgot password?
            </a>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            data-cy="login-button"
            class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#e5d4a6] to-[#f4ecd8] text-[#1a1a1a] font-bold tracking-wide hover:opacity-90 transition-all shadow-[0_0_20px_rgba(229,212,166,0.3)] mt-4"
            [disabled]="isLoading"
            [class]="isLoading ? 'opacity-75 cursor-not-allowed' : 'hover:-translate-y-0.5'"
          >
            <span *ngIf="isLoading" class="inline-flex items-center">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>
              Signing in...
            </span>
            <span *ngIf="!isLoading">Sign In</span>
          </button>
        </div>
      </form>

      <!-- Social Login -->
      <div *ngIf="showSocialLogin" class="px-8 pb-6">
        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-white/10"></div>
          <span class="flex-shrink-0 mx-4 text-xs text-foreground/40 uppercase tracking-widest">Or</span>
          <div class="flex-grow border-t border-white/10"></div>
        </div>

        <div class="mt-4 grid grid-cols-3 gap-3">
          <button type="button" (click)="loginWithGoogle()" class="flex justify-center items-center py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors">
            <i class="fa-brands fa-google text-foreground/80"></i>
          </button>
          <button type="button" (click)="loginWithFacebook()" class="flex justify-center items-center py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors">
            <i class="fa-brands fa-facebook-f text-foreground/80"></i>
          </button>
          <button type="button" (click)="loginWithTwitter()" class="flex justify-center items-center py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors">
            <i class="fa-brands fa-twitter text-foreground/80"></i>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-8 py-6 text-center border-t border-white/5 bg-black/20">
        <p class="text-foreground/60 text-sm">
          Don't have an account?
          <a routerLink="/register" class="text-[#e5d4a6] hover:text-white font-semibold ml-1 transition-colors">
            Sign up
          </a>
        </p>
      </div>
    </div>

    <!-- Additional Links -->
    <div class="mt-8 text-center">
      <p class="text-xs text-foreground/40">
        By signing in, you agree to our<br>
        <a href="/terms" class="text-foreground/60 hover:text-[#e5d4a6] transition-colors underline decoration-white/20 underline-offset-4 mx-1">Terms of Service</a>
        and
        <a href="/privacy" class="text-foreground/60 hover:text-[#e5d4a6] transition-colors underline decoration-white/20 underline-offset-4 mx-1">Privacy Policy</a>
      </p>
    </div>
  </div>
</div>
