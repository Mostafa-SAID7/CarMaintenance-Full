<div class="min-h-screen flex flex-col bg-[#0a0a0a] text-foreground">
  <app-navbar *ngIf="showNavbar" class="flex-none"></app-navbar>

  <!-- Network Status Indicator -->
  <app-network-status></app-network-status>

  <main class="flex-grow w-full transition-all duration-300">
    <router-outlet></router-outlet>
  </main>

  <app-footer *ngIf="showFooter" class="flex-none mt-auto"></app-footer>

  <!-- Scroll to Top Button -->
  <app-scroll-to-top *ngIf="showScrollToTop"></app-scroll-to-top>

  <!-- PWA Install Prompt -->
  <app-pwa-install-prompt></app-pwa-install-prompt>
</div>
