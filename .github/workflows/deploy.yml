name: 🌐 Deployment

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-staging:
    name: 🧪 Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy Backend to Staging
      run: |
        echo "Deploying backend to staging..."
        # Add your staging deployment commands here
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
      continue-on-error: true
      
    - name: 🚀 Deploy Frontend to Staging
      run: |
        echo "Deploying frontend to staging..."
        # Add your staging deployment commands here
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
      continue-on-error: true

  deploy-production:
    name: 🎯 Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-verification]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ClientApp/package-lock.json'
        
    - name: 📦 Build Production Backend
      run: dotnet publish -c Release -o ./publish/backend
      
    - name: 📦 Build Production Frontend
      run: |
        cd ClientApp
        npm ci
        npm run build:prod
        
    - name: 🚀 Deploy Backend to Production
      run: |
        echo "Deploying backend to production..."
        # Add your production deployment commands here
      env:
        PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
      continue-on-error: true
      
    - name: 🚀 Deploy Frontend to Production
      run: |
        echo "Deploying frontend to production..."
        # Add your production deployment commands here
      env:
        PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
      continue-on-error: true
      
    - name: 📧 Notify Deployment Success
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Deployment to production completed successfully!'
          })
      continue-on-error: true

  build-verification:
    name: ✅ Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ClientApp/package-lock.json'
        
    - name: ✅ Verify Builds
      run: |
        dotnet build --configuration Release
        cd ClientApp
        npm ci
        npm run build:prod
