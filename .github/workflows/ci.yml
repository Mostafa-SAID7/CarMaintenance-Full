name: 🧪 Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: 🧪 Backend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'
        
    - run: dotnet restore
      
    - run: dotnet test --configuration Release --no-restore /p:CollectCoverage=true /p:CoverageFormat=cobertura
      
    - uses: codecov/codecov-action@v3
      with:
        files: '**/coverage.cobertura.xml'
        flags: backend

  frontend-test:
    name: 🧪 Frontend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ClientApp/package-lock.json'
        
    - run: cd ClientApp && npm ci && npm run test:ci
      
    - uses: codecov/codecov-action@v3
      with:
        files: './ClientApp/coverage/cobertura-coverage.xml'
        flags: frontend

