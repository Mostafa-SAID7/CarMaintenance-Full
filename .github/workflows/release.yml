name: 📦 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: 📦 Create Release Package
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'
        
    - uses: actions/setup-node@v7
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ClientApp/package-lock.json'
        
    - id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - run: dotnet publish -c Release -o ./publish/backend
      
    - run: cd ClientApp && npm ci && npm run build:prod
      
    - run: |
        cd ./publish/backend
        zip -r ../backend-v${{ steps.version.outputs.version }}.zip .
      shell: bash
      
    - run: |
        cd ClientApp/dist
        zip -r ../../frontend-v${{ steps.version.outputs.version }}.zip .
      shell: bash
      
    - uses: softprops/action-gh-release@v1
      with:
        files: |
          ./publish/backend-v${{ steps.version.outputs.version }}.zip
          ./frontend-v${{ steps.version.outputs.version }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

