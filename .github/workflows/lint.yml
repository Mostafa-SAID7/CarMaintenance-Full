name: 📝 Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-lint:
    name: 📝 Lint Frontend Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ClientApp/package-lock.json'
        
    - run: cd ClientApp && npm ci && npm run lint --if-present || true
    
    - run: cd ClientApp && npm run format:check --if-present || true
