version: 2
updates:
  # ============== NPM Dependencies ==============
  - package-ecosystem: "npm"
    directory: "/ClientApp"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Mostafa-SAID7"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # ============== NuGet Dependencies ==============
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Mostafa-SAID7"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # ============== GitHub Actions ==============
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Mostafa-SAID7"
    labels:
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "chore(ci):"
      include: "scope"
